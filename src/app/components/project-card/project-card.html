<article class="card">
  <div class="card-header">
    <h3>{{ project().title }}</h3>
    <span class="role-badge">{{ project().roleOrType }}</span>
  </div>

  <p class="description">{{ project().description }}</p>

  <ul class="tech-list">
    @for (tech of project().technologies; track tech) {
      <li class="tech-tag">{{ tech }}</li>
    }
  </ul>

  @if (project().githubUrl) {
    <div class="card-links">
      <a [href]="project().githubUrl" target="_blank" rel="noopener">GitHub Code →</a>
    </div>
  }
</article>
